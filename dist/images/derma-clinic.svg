<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="dermaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFAF7"/>
      <stop offset="60%" stop-color="#EBF3ED"/>
      <stop offset="100%" stop-color="#F3E7DD"/>
    </linearGradient>
    <radialGradient id="dermaGlow" cx="60%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#6B8F71" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FDFAF7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#dermaBg)"/>
  <circle cx="480" cy="210" r="240" fill="url(#dermaGlow)"/>

  <!-- Sparkle & Skin Health Motif -->
  <g transform="translate(400, 220)">
    <circle cx="0" cy="0" r="85" stroke="#6B8F71" stroke-width="2.5" fill="none"/>
    <path d="M0,-45 Q0,0 -45,0 Q0,0 0,45 Q0,0 45,0 Q0,0 0,-45 Z" fill="#6B8F71" fill-opacity="0.8"/>
    <circle cx="40" cy="-35" r="8" fill="#D42B24" fill-opacity="0.6"/>
    <circle cx="-35" cy="40" r="6" fill="#7A1512" fill-opacity="0.4"/>
  </g>

  <!-- Typography Labels -->
  <text x="400" y="420" text-anchor="middle" fill="#7A1512" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="1">DERMA CLINIC & SKIN CARE</text>
  <text x="400" y="450" text-anchor="middle" fill="#6B8F71" font-family="system-ui, sans-serif" font-size="14" font-weight="700">YES DAY CARE CLINIC • KUDAL</text>
  <text x="400" y="475" text-anchor="middle" fill="#2B1A18" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="12">Clinical Dermatology, Acne, Eczema & Scalp Care</text>
</svg>
