<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFAF7"/>
      <stop offset="50%" stop-color="#FBEDEA"/>
      <stop offset="100%" stop-color="#F3E7DD"/>
    </linearGradient>
    <radialGradient id="aurora" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#D42B24" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FDFAF7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="560" cy="180" r="280" fill="url(#aurora)"/>
  
  <!-- Architectural grid lines -->
  <line x1="100" y1="500" x2="700" y2="500" stroke="#7A1512" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="200" y1="150" x2="200" y2="500" stroke="#7A1512" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="600" y1="150" x2="600" y2="500" stroke="#7A1512" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Stylized Observation Unit / Medical Bed graphic -->
  <g transform="translate(280, 230)">
    <rect x="0" y="80" width="240" height="20" rx="6" fill="#7A1512" fill-opacity="0.8"/>
    <rect x="20" y="30" width="80" height="50" rx="10" fill="#D42B24" fill-opacity="0.7"/>
    <rect x="110" y="50" width="110" height="30" rx="6" fill="#7A1512" fill-opacity="0.3"/>
    
    <!-- Bed legs -->
    <rect x="20" y="100" width="8" height="50" rx="3" fill="#2B1A18" fill-opacity="0.6"/>
    <rect x="210" y="100" width="8" height="50" rx="3" fill="#2B1A18" fill-opacity="0.6"/>
    <!-- IV pole -->
    <line x1="250" y1="0" x2="250" y2="150" stroke="#D42B24" stroke-width="3"/>
    <path d="M240,15 Q250,5 260,15" stroke="#D42B24" stroke-width="3" fill="none"/>
    <rect x="245" y="25" width="10" height="25" rx="3" fill="#6B8F71"/>
  </g>

  <!-- Typography Labels -->
  <text x="400" y="440" text-anchor="middle" fill="#7A1512" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="1">DAY CARE OBSERVATION UNIT</text>
  <text x="400" y="470" text-anchor="middle" fill="#D42B24" font-family="system-ui, sans-serif" font-size="14" font-weight="600">YES DAY CARE CLINIC • KUDAL</text>
</svg>
