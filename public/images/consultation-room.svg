  <text x="400" y="420" text-anchor="middle" fill="#7A1512" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="1">PHYSICIAN CONSULTATION SUITE</text>
  <text x="400" y="450" text-anchor="middle" fill="#D42B24" font-family="system-ui, sans-serif" font-size="14" font-weight="600">MULTISPECIALTY OPD • KUDAL</text>
  <text x="400" y="475" text-anchor="middle" fill="#2B1A18" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="12">Quiet, Private & Evidence-Based Consultations</text>
