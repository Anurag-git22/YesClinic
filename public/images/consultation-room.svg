      <stop offset="0%" stop-color="#FDFAF7"/>
      <stop offset="60%" stop-color="#FBEDEA"/>
      <stop offset="100%" stop-color="#F3E7DD"/>
    </linearGradient>
    <radialGradient id="crGlow" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#D42B24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FDFAF7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#crBg)"/>
  <circle cx="240" cy="180" r="240" fill="url(#crGlow)"/>

  <!-- Stethoscope icon motif -->
