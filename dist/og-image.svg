<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFAF7"/>
      <stop offset="40%" stop-color="#FBEDEA"/>
      <stop offset="100%" stop-color="#F3E7DD"/>
    </linearGradient>
    <radialGradient id="ogGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#D42B24" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FDFAF7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <circle cx="960" cy="140" r="400" fill="url(#ogGlow)"/>

  <!-- Left Content -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#7A1512" fill-opacity="0.1"/>
    <text x="110" y="24" text-anchor="middle" fill="#7A1512" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">KUDAL, SINDHUDURG</text>

    <text x="0" y="100" fill="#7A1512" font-family="system-ui, Georgia, serif" font-size="58" font-weight="800" letter-spacing="-1">YES DAY CARE CLINIC</text>
    <text x="0" y="150" fill="#D42B24" font-family="'Noto Sans Devanagari', system-ui, sans-serif" font-size="34" font-weight="700">यस डे केअर क्लिनिक • कुडाळ</text>

    <text x="0" y="210" fill="#2B1A18" font-family="system-ui, sans-serif" font-size="22" font-weight="500">Day Care Centre • Polyclinic • Diabetes &amp; Heart Care • Derma Clinic</text>
    <text x="0" y="250" fill="#7A1512" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Cardiology &amp; 2D Echo with Dr. Digambar Naik</text>

    <!-- Contact & Rating info -->
    <g transform="translate(0, 310)">
      <text x="0" y="0" fill="#D42B24" font-family="system-ui, sans-serif" font-size="18" font-weight="700">☎ +91 80106 67696 • 02362 299002</text>
      <text x="0" y="30" fill="#2B1A18" fill-opacity="0.7" font-family="system-ui, sans-serif" font-size="16">Ground Floor, Opposite Kudal Police Station, Maharashtra 416520</text>
    </g>
  </g>

  <!-- Right Seal Graphic -->
  <g transform="translate(940, 315) rotate(-4)">
    <circle cx="0" cy="0" r="160" fill="#FFFFFF" stroke="#D42B24" stroke-width="4"/>
    <circle cx="0" cy="0" r="148" stroke="#D42B24" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <circle cx="0" cy="0" r="115" stroke="#D42B24" stroke-width="2" fill="none"/>

    <text x="0" y="-30" text-anchor="middle" fill="#D42B24" font-family="Georgia, serif" font-size="44" font-style="italic" font-weight="bold">Yes</text>
    <text x="0" y="20" text-anchor="middle" fill="#D42B24" font-family="'Noto Sans Devanagari', sans-serif" font-size="20" font-weight="700">डे केअर क्लिनिक</text>
    <text x="0" y="60" text-anchor="middle" fill="#7A1512" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">KUDAL • SINDHUDURG</text>
  </g>
</svg>
