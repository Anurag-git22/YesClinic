<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="recBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFAF7"/>
      <stop offset="50%" stop-color="#FBEDEA"/>
      <stop offset="100%" stop-color="#F3E7DD"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#recBg)"/>

  <!-- Reception desk abstract design -->
  <g transform="translate(240, 180)">
    <!-- Reception counter -->
    <rect x="0" y="80" width="320" height="90" rx="14" fill="#FFFFFF" stroke="#7A1512" stroke-opacity="0.2" stroke-width="2"/>
    <rect x="20" y="100" width="280" height="20" rx="4" fill="#FBEDEA"/>
    <!-- Reception seal on desk -->
    <circle cx="160" cy="140" r="16" fill="#D42B24"/>
    <circle cx="160" cy="140" r="13" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
    <!-- Patient lounge seating -->
    <rect x="-40" y="110" width="30" height="50" rx="6" fill="#7A1512" fill-opacity="0.5"/>
    <rect x="330" y="110" width="30" height="50" rx="6" fill="#7A1512" fill-opacity="0.5"/>
  </g>

  <!-- Typography Labels -->
  <text x="400" y="440" text-anchor="middle" fill="#7A1512" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="1">PATIENT RECEPTION & WAITING AREA</text>
  <text x="400" y="470" text-anchor="middle" fill="#D42B24" font-family="system-ui, sans-serif" font-size="14" font-weight="600">YES DAY CARE CLINIC • KUDAL</text>
  <text x="400" y="495" text-anchor="middle" fill="#2B1A18" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="12">Warm, Comfortable & Senior-Friendly Waiting Lounge</text>
</svg>
